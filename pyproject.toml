[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-doc-agent"
version = "0.1.0"
description = "A fully local private document assistant built with Google ADK, Gemma, and Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "google-adk[db]",
    "litellm",
    "pypdf",
    "python-docx",
    "aiosqlite",
]

[tool.setuptools]
packages = ["src", "src.workspace"]
include-package-data = true

[tool.setuptools.package-data]
src = ["workspace/*"]
